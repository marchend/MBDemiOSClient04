name: AcmeBank
options:
  bundleIdPrefix: com.acmebank
  deploymentTarget:
    iOS: "17.0"
packages:
  # Pin okta-mobile-swift to the 2.x major (bootstrap spec). `from:`
  # is the version-requirement form xcodegen accepts — bare
  # `minVersion` errors with "Unknown package requirement" before any
  # compile reaches xcodebuild. Resolved version is captured in
  # Package.resolved on first SPM resolve.
  OktaClient:
    url: https://github.com/okta/okta-mobile-swift
    from: 2.0.0
targets:
  AcmeBank:
    type: application
    platform: iOS
    sources:
      # Broad glob picks up App/, Features/, DesignSystem/, Resources/,
      # AcmeBank.entitlements, PrivacyInfo.xcprivacy, AND the new
      # Sources/Auth + Sources/Landing trees added in this and
      # subsequent story PRs. Sources/Landing/ ships in a later PR
      # but is covered automatically by this directory glob — no
      # second project.yml edit needed when those files arrive.
      - path: AcmeBank
        excludes:
          # Info.plist is referenced via INFOPLIST_FILE, not as a
          # resource — exclude so it isn't double-bundled.
          - Info.plist
    dependencies:
      - package: OktaClient
        product: OktaDirectAuth
    # Okta / BFF config is supplied as build settings (Config/AppConfig.xcconfig,
    # which optionally includes the gitignored Config/Secrets.local.xcconfig
    # written by setup.sh) and expanded into the built Info.plist by Xcode's
    # ProcessInfoPlistFile. This replaces a post-build script that mutated the
    # built plist — that approach was racy (ProcessInfoPlistFile could re-run
    # after it, e.g. after `xcodegen generate`, re-copying the sentinel source
    # and forcing a manual Clean Build Folder). See Config/AppConfig.xcconfig.
    configFiles:
      Debug: Config/AppConfig.xcconfig
      Release: Config/AppConfig.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.acmebank.mobile
        SWIFT_VERSION: "5.10"
        # Custom Info.plist carrying the OKTA_* / API_BASE_URL keys as
        # $(VAR) references expanded from Config/AppConfig.xcconfig, plus
        # the standard launch-screen / scene-manifest entries.
        # GENERATE_INFOPLIST_FILE only injects the Apple-defined
        # `INFOPLIST_KEY_*` set; arbitrary keys require a real source
        # plist + INFOPLIST_FILE.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: AcmeBank/Info.plist
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_ENTITLEMENTS: AcmeBank/AcmeBank.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  AcmeBankTests:
    type: bundle.unit-test
    platform: iOS
    sources: [AcmeBankTests]
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
  AcmeBankUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      # Broad directory glob picks up every .swift file under
      # AcmeBankUITests/ automatically. When SignInFlowUITests.swift
      # lands in a later PR of this story it will be wired in by
      # this same glob with no project.yml edit required.
      #
      # Do NOT pre-register a not-yet-existent file with an explicit
      # `- path: AcmeBankUITests/SignInFlowUITests.swift` + `optional: true`
      # entry: XcodeGen's `optional: true` only suppresses the
      # generation-time "file missing" error — the explicit path is
      # still written into the generated .xcodeproj as a build input,
      # and xcodebuild then fails at compile time with
      # "Build input file cannot be found" because the .swift file
      # is absent on disk.
      - path: AcmeBankUITests
    dependencies:
      - target: AcmeBank
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
schemes:
  AcmeBank:
    build:
      targets:
        AcmeBank: all
    test:
      # `test.targets` entries use the bare `- name:` form — the
      # `- target:` form is rejected by xcodegen's scheme schema.
      targets:
        - name: AcmeBankTests
        - name: AcmeBankUITests
      parallelizable: false
